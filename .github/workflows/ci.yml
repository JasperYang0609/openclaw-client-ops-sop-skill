name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile scripts/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Post-run check
        run: python scripts/post_run_check.py
      - name: Verify CI workflow contract
        run: python scripts/check_ci_workflow_contract.py
